name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      ANTHROPIC_API_KEY: placeholder-anthropic-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      # Non-blocking for now: the repo has pre-existing lint errors unrelated
      # to any specific change (conditional hooks in Sidebar.tsx, a purity
      # violation in BriefsListClient.tsx, a few unescaped-entity warnings).
      # Flip this to a hard gate once those are cleaned up separately.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
